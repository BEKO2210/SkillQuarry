[project]
name = "lockscope"
version = "1.0.0"
description = "Detect and repair dangerous Rust lock lifetimes"
requires-python = ">=3.10"
dependencies = ["tree-sitter==0.25.2", "tree-sitter-rust==0.24.0"]

[project.scripts]
lockscope = "lockscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["lockscope"]
