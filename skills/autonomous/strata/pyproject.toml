[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-runner"
version = "1.0.0"
description = "Fresh-context, crash-safe generational handoff runner for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["claude-code", "agent", "autonomous", "ralph-loop", "context-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/BEKO2210/SkillQuarry"
Source = "https://github.com/BEKO2210/SkillQuarry/tree/main/skills/autonomous/strata"

[project.scripts]
strata = "strata.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
