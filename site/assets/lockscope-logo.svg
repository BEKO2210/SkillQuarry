<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="LockScope">
  <title>LockScope</title>
  <desc>A timeline of suspension points, with a lock that covers only the span it has to.</desc>
  <defs>
    <linearGradient id="ls-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2733"/>
      <stop offset="1" stop-color="#0d141b"/>
    </linearGradient>
    <linearGradient id="ls-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#f0932b"/>
    </linearGradient>
    <clipPath id="ls-frame">
      <rect x="4" y="4" width="120" height="120" rx="26"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#ls-ground)"/>

  <g clip-path="url(#ls-frame)">
    <!-- The timeline of an async function: it runs on regardless. -->
    <path d="M4 92 H124" stroke="#233140" stroke-width="4" stroke-linecap="round"/>

    <!-- Suspension points. The middle one falls inside the guarded span. -->
    <g fill="#4a6a80">
      <circle cx="26" cy="92" r="5"/>
      <circle cx="102" cy="92" r="5"/>
    </g>
    <circle cx="64" cy="92" r="6" fill="#0d141b" stroke="url(#ls-line)" stroke-width="3.5"/>

    <!-- The guarded span: bounded on both sides, no wider than it must be. -->
    <path d="M44 92 V72" stroke="url(#ls-line)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M84 92 V72" stroke="url(#ls-line)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- The lock itself. -->
    <path d="M52 46 v-6 a12 12 0 0 1 24 0 v6"
          fill="none" stroke="url(#ls-line)" stroke-width="5" stroke-linecap="round"/>
    <rect x="42" y="46" width="44" height="30" rx="8" fill="none"
          stroke="url(#ls-line)" stroke-width="5"/>
    <circle cx="64" cy="61" r="4" fill="url(#ls-line)"/>
  </g>

  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" fill="none"
        stroke="#ffd479" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
