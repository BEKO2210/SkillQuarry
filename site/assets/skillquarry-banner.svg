<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="SkillQuarry — the open marketplace for agent skills">
  <title>SkillQuarry — the open marketplace for agent skills</title>
  <defs>
    <linearGradient id="sqb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c25"/>
      <stop offset="1" stop-color="#0a1015"/>
    </linearGradient>
    <linearGradient id="sqb-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2733"/>
      <stop offset="1" stop-color="#0d141b"/>
    </linearGradient>
    <linearGradient id="sqb-ore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#f0932b"/>
    </linearGradient>
    <clipPath id="sqb-frame">
      <rect x="64" y="86" width="128" height="128" rx="28"/>
    </clipPath>
  </defs>

  <rect width="960" height="300" fill="url(#sqb-bg)"/>

  <!-- Quarry benches receding across the banner. -->
  <g opacity="0.14" stroke="#6e9bb0" stroke-width="2" fill="none">
    <path d="M0 214 H300 V244 H620 V274 H960"/>
    <path d="M0 254 H220 V284 H540 V300"/>
  </g>

  <g>
    <rect x="64" y="86" width="128" height="128" rx="28" fill="url(#sqb-ground)"/>
    <g clip-path="url(#sqb-frame)">
      <path d="M64 126 H120 V146 H146 V166 H172 V186 H192 V214 H64 Z" fill="#3d5568"/>
      <path d="M64 142 H104 V162 H132 V182 H164 V214 H64 Z" fill="#4a6a80"/>
      <path d="M64 162 H90 V182 H122 V214 H64 Z" fill="#5b8298"/>
      <path d="M64 184 H80 V214 H64 Z" fill="#6e9bb0"/>
      <g stroke="#0b1219" stroke-width="2.2" fill="none" stroke-linecap="square">
        <path d="M64 126 H120 V146 H146 V166 H172 V186 H192"/>
        <path d="M64 142 H104 V162 H132 V182 H164 V214"/>
        <path d="M64 162 H90 V182 H122 V214"/>
      </g>
      <g transform="translate(146 126) rotate(12)">
        <path d="M0 -18 L15 0 L0 18 L-15 0 Z" fill="url(#sqb-ore)"/>
        <path d="M0 -18 L15 0 L0 0 Z" fill="#ffffff" opacity="0.3"/>
        <path d="M0 18 L-15 0 L0 0 Z" fill="#0d141b" opacity="0.25"/>
      </g>
    </g>
    <rect x="64.75" y="86.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#ffd479" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="236" y="140" font-size="60" font-weight="700" letter-spacing="1">
      <tspan fill="#f4f8fb">Skill</tspan><tspan fill="#ffd479">Quarry</tspan>
    </text>
    <text x="240" y="178" fill="#9fb8c9" font-size="21" letter-spacing="2.4">The open marketplace for agent skills</text>
    <g font-size="16" letter-spacing="1.4">
      <text x="240" y="214" fill="#ffd479">Discover</text>
      <text x="330" y="214" fill="#5b8298">·</text>
      <text x="348" y="214" fill="#ffd479">Inspect</text>
      <text x="424" y="214" fill="#5b8298">·</text>
      <text x="442" y="214" fill="#ffd479">Test</text>
      <text x="492" y="214" fill="#5b8298">·</text>
      <text x="510" y="214" fill="#ffd479">Install</text>
      <text x="578" y="214" fill="#5b8298">·</text>
      <text x="596" y="214" fill="#ffd479">Share</text>
    </g>
    <text x="240" y="248" fill="#6e8598" font-size="15" letter-spacing="1.2">Build capabilities once. Share intelligence everywhere.</text>
  </g>
</svg>
