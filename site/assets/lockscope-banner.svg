<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="LockScope — dangerous Rust lock lifetimes, found and conservatively repaired">
  <title>LockScope — dangerous Rust lock lifetimes, found and conservatively repaired</title>
  <defs>
    <linearGradient id="lsb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c25"/>
      <stop offset="1" stop-color="#0a1015"/>
    </linearGradient>
    <linearGradient id="lsb-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2733"/>
      <stop offset="1" stop-color="#0d141b"/>
    </linearGradient>
    <linearGradient id="lsb-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#f0932b"/>
    </linearGradient>
    <clipPath id="lsb-frame">
      <rect x="64" y="66" width="128" height="128" rx="28"/>
    </clipPath>
  </defs>

  <rect width="960" height="260" fill="url(#lsb-bg)"/>

  <!-- The task timeline runs the width of the banner; the guarded span is short. -->
  <g opacity="0.2">
    <path d="M0 226 H960" stroke="#5b8298" stroke-width="2" stroke-dasharray="10 12"/>
  </g>

  <g>
    <rect x="64" y="66" width="128" height="128" rx="28" fill="url(#lsb-ground)"/>
    <g clip-path="url(#lsb-frame)">
      <path d="M64 154 H192" stroke="#233140" stroke-width="4" stroke-linecap="round"/>
      <g fill="#4a6a80">
        <circle cx="86" cy="154" r="5"/>
        <circle cx="170" cy="154" r="5"/>
      </g>
      <circle cx="128" cy="154" r="6" fill="#0d141b" stroke="url(#lsb-line)" stroke-width="3.5"/>
      <path d="M108 154 V134" stroke="url(#lsb-line)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M148 154 V134" stroke="url(#lsb-line)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M116 108 v-6 a12 12 0 0 1 24 0 v6" fill="none"
            stroke="url(#lsb-line)" stroke-width="5" stroke-linecap="round"/>
      <rect x="106" y="108" width="44" height="30" rx="8" fill="none"
            stroke="url(#lsb-line)" stroke-width="5"/>
      <circle cx="128" cy="123" r="4" fill="url(#lsb-line)"/>
    </g>
    <rect x="64.75" y="66.75" width="126.5" height="126.5" rx="27.25" fill="none"
          stroke="#ffd479" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="236" y="126" fill="#f4f8fb" font-size="58" font-weight="700" letter-spacing="4">LOCKSCOPE</text>
    <text x="240" y="162" fill="#9fb8c9" font-size="21" letter-spacing="2.4">Rust lock lifetimes, held no longer than they must be</text>
    <g font-size="16" fill="#ffd479" letter-spacing="1.4">
      <text x="240" y="196">Structured syntax</text>
      <text x="400" y="196" fill="#5b8298">·</text>
      <text x="418" y="196">Resolved semantics</text>
      <text x="586" y="196" fill="#5b8298">·</text>
      <text x="604" y="196">Compiler proof</text>
    </g>
  </g>
</svg>
