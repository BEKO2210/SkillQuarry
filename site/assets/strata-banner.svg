<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Strata — generational handoff runner">
  <title>Strata — generational handoff runner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c25"/>
      <stop offset="1" stop-color="#0a1015"/>
    </linearGradient>
    <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2733"/>
      <stop offset="1" stop-color="#0d141b"/>
    </linearGradient>
    <linearGradient id="core2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#f0932b"/>
    </linearGradient>
    <clipPath id="frame2">
      <rect x="64" y="66" width="128" height="128" rx="28"/>
    </clipPath>
  </defs>

  <rect width="960" height="260" fill="url(#bg)"/>

  <!-- Faint strata running across the whole banner. -->
  <g opacity="0.16">
    <path d="M0 150 q120 -22 240 -4 q120 18 240 -2 q120 -20 240 2 q120 22 240 -6 V260 H0 Z" fill="#5b8298" stroke="#0b1219" stroke-width="1.6"/>
    <path d="M0 196 q140 20 280 2 q140 -18 280 4 q140 22 400 -8 V260 H0 Z" fill="#6e9bb0" stroke="#0b1219" stroke-width="1.6"/>
  </g>

  <!-- Mark -->
  <g>
    <rect x="64" y="66" width="128" height="128" rx="28" fill="url(#ground2)"/>
    <g clip-path="url(#frame2)">
      <path d="M64 106 q24 -10 44 -2 q20 8 42 1 q22 -8 42 0 V127 H64 Z" fill="#3d5568" stroke="#0b1219" stroke-width="1.6"/>
      <path d="M64 127 q24 8 46 1 q20 -7 40 1 q20 8 42 -1 V146 H64 Z" fill="#4a6a80" stroke="#0b1219" stroke-width="1.6"/>
      <path d="M64 146 q22 -8 44 -1 q22 7 44 -1 q20 -7 40 2 V165 H64 Z" fill="#5b8298" stroke="#0b1219" stroke-width="1.6"/>
      <path d="M64 165 q24 8 44 0 q22 -8 44 1 q20 8 40 -1 V194 H64 Z" fill="#6e9bb0" stroke="#0b1219" stroke-width="1.6"/>
      <path d="M64 66 h128 v37 q-24 -10 -46 -2 q-20 8 -42 0 q-18 -6 -40 2 Z" fill="#233140"/>
      <rect x="121" y="77" width="15" height="110" rx="7.5" fill="url(#core2)"/>
      <g fill="#0d141b" opacity="0.38">
        <rect x="121" y="107" width="15" height="3"/>
        <rect x="121" y="128" width="15" height="3"/>
        <rect x="121" y="147" width="15" height="3"/>
        <rect x="121" y="166" width="15" height="3"/>
      </g>
      <rect x="121" y="77" width="5" height="110" rx="2.5" fill="#ffffff" opacity="0.28"/>
    </g>
    <rect x="64.75" y="66.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#ffd479" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="236" y="126" fill="#f4f8fb" font-size="66" font-weight="700" letter-spacing="10">STRATA</text>
    <text x="240" y="162" fill="#9fb8c9" font-size="21" letter-spacing="2.6">Generational handoff runner for Claude Code</text>
    <g font-size="16" fill="#ffd479" letter-spacing="1.4">
      <text x="240" y="196">Fresh context</text>
      <text x="372" y="196" fill="#5b8298">·</text>
      <text x="390" y="196">Verified completion</text>
      <text x="562" y="196" fill="#5b8298">·</text>
      <text x="580" y="196">Crash-safe state</text>
    </g>
  </g>
</svg>
