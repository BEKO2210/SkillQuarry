<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="hitmap-title hitmap-desc">
  <title id="hitmap-title">HITMAP — browser hit-test reachability</title>
  <desc id="hitmap-desc">A visible interactive target is covered by a pointer-receiving overlay. Nine sampled points show zero reachable points.</desc>

  <defs>
    <linearGradient id="hm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c25"/>
      <stop offset="1" stop-color="#0a1015"/>
    </linearGradient>
    <linearGradient id="hm-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2733"/>
      <stop offset="1" stop-color="#0d141b"/>
    </linearGradient>
    <linearGradient id="hm-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee7f2"/>
      <stop offset="1" stop-color="#4a9db8"/>
    </linearGradient>
    <linearGradient id="hm-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#f0932b"/>
    </linearGradient>
    <clipPath id="hm-frame">
      <rect x="64" y="66" width="128" height="128" rx="28"/>
    </clipPath>
  </defs>

  <rect width="960" height="260" fill="url(#hm-bg)"/>

  <!-- Faint browser hit-test rays: visible geometry is not necessarily the event receiver. -->
  <g opacity="0.13" fill="none" stroke="#5b8298" stroke-width="1.5">
    <path d="M0 221 H960"/>
    <path d="M656 0 V260"/>
    <path d="M810 0 V260"/>
  </g>

  <!-- Mark -->
  <g>
    <rect x="64" y="66" width="128" height="128" rx="28" fill="url(#hm-mark)"/>
    <g clip-path="url(#hm-frame)">
      <!-- The visible control -->
      <rect x="82" y="89" width="92" height="76" rx="15" fill="#102a34" stroke="url(#hm-cyan)" stroke-width="3"/>
      <path d="M96 105 H160 M96 121 H151" stroke="#77cddd" stroke-width="5" stroke-linecap="round" opacity=".72"/>

      <!-- Pointer-receiving overlay crossing the target -->
      <path d="M73 81 L193 119 L193 177 L73 139 Z" fill="#f0932b" fill-opacity=".20" stroke="url(#hm-amber)" stroke-width="2.5"/>
      <path d="M74 81 L193 119" stroke="#ffd479" stroke-width="2" stroke-dasharray="6 6" opacity=".72"/>

      <!-- Nine mechanically sampled points -->
      <g fill="#ff7a72" stroke="#3b1210" stroke-width="2">
        <circle cx="103" cy="111" r="4.5"/>
        <circle cx="128" cy="111" r="4.5"/>
        <circle cx="153" cy="111" r="4.5"/>
        <circle cx="103" cy="127" r="4.5"/>
        <circle cx="128" cy="127" r="4.5"/>
        <circle cx="153" cy="127" r="4.5"/>
        <circle cx="103" cy="143" r="4.5"/>
        <circle cx="128" cy="143" r="4.5"/>
        <circle cx="153" cy="143" r="4.5"/>
      </g>

      <!-- Hit-test cursor and failed path -->
      <path d="M158 177 L142 142 L171 154 L160 160 L169 177 Z" fill="#f4f8fb" stroke="#0a1015" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M166 181 l12 12" stroke="#ff7a72" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M178 181 l-12 12" stroke="#ff7a72" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <rect x="64.75" y="66.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#7ee7f2" stroke-opacity=".42" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="236" y="126" fill="#f4f8fb" font-size="64" font-weight="700" letter-spacing="8">HITMAP</text>
    <text x="240" y="162" fill="#9fb8c9" font-size="21" letter-spacing="2.4">Browser hit-test reachability</text>
    <g font-size="16" letter-spacing="1.2">
      <text x="240" y="196" fill="#7ee7f2">Visible target</text>
      <text x="352" y="196" fill="#5b8298">·</text>
      <text x="370" y="196" fill="#ff9a82">0 / 9 reachable</text>
      <text x="500" y="196" fill="#5b8298">·</text>
      <text x="518" y="196" fill="#ffd479">Browser oracle</text>
    </g>
  </g>

  <!-- Compact evidence panel -->
  <g transform="translate(706 76)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect width="190" height="108" rx="18" fill="#0d141b" stroke="#2b3f50" stroke-width="1.5"/>
    <text x="22" y="31" fill="#728fa3" font-size="12" font-weight="700" letter-spacing="1.8">HIT TEST</text>
    <text x="22" y="59" fill="#f4f8fb" font-size="24" font-weight="700">0 / 9</text>
    <text x="94" y="59" fill="#8fa9ba" font-size="13">reachable</text>
    <path d="M22 78 H168" stroke="#223442" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 78 H22" stroke="#ff7a72" stroke-width="6" stroke-linecap="round"/>
    <text x="22" y="98" fill="#ff9a82" font-size="11" letter-spacing=".7">OCCLUDED</text>
  </g>
</svg>
