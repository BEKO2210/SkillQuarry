<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="520" viewBox="0 0 1640 520" role="img" aria-labelledby="title desc">
  <title id="title">HITMAP</title>
  <desc id="desc">A browser hit-test reachability diagram showing a visible button blocked by an overlay and nine sampled points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#111c28"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a3b4b" stroke-width="1" opacity=".36"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1640" height="520" rx="34" fill="url(#bg)"/>
  <rect width="1640" height="520" rx="34" fill="url(#grid)"/>

  <g transform="translate(98 104)">
    <text x="0" y="72" fill="#f1f5f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="700" letter-spacing="9">HITMAP</text>
    <text x="3" y="126" fill="#95a7b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">browser hit-test reachability</text>
    <text x="3" y="220" fill="#d8e2ea" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">visible target</text>
    <text x="185" y="220" fill="#72879a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">≠</text>
    <text x="224" y="220" fill="#ffbf69" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">pointer-reachable target</text>
    <text x="3" y="280" fill="#71879a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">9 points · browser oracle · zero screenshot judgement</text>
  </g>

  <g transform="translate(875 88)" filter="url(#shadow)">
    <rect x="0" y="0" width="650" height="344" rx="30" fill="#0d1721" stroke="#2c4052" stroke-width="2"/>
    <rect x="78" y="102" width="410" height="150" rx="24" fill="#1c6f82" stroke="#66d9ef" stroke-width="3"/>
    <text x="283" y="190" text-anchor="middle" fill="#e8fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="650">TARGET</text>

    <rect x="42" y="68" width="512" height="218" rx="28" fill="#f59e0b" fill-opacity=".16" stroke="#ffbf69" stroke-width="3" stroke-dasharray="12 10"/>
    <text x="574" y="100" fill="#ffbf69" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">overlay</text>

    <g fill="#ff6b6b" stroke="#260b0b" stroke-width="3">
      <circle cx="283" cy="177" r="10"/>
      <circle cx="160" cy="132" r="10"/><circle cx="406" cy="132" r="10"/>
      <circle cx="160" cy="222" r="10"/><circle cx="406" cy="222" r="10"/>
      <circle cx="283" cy="132" r="10"/><circle cx="406" cy="177" r="10"/>
      <circle cx="283" cy="222" r="10"/><circle cx="160" cy="177" r="10"/>
    </g>

    <path d="M585 238c-26 8-44 27-54 58" fill="none" stroke="#ffbf69" stroke-width="4" stroke-linecap="round"/>
    <path d="M530 296l-5-18 18 7" fill="#ffbf69"/>
    <text x="568" y="245" fill="#dce7ef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">0 / 9 reachable</text>
  </g>
</svg>
