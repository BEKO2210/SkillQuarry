name: RanGate render temporary

on:
  push:
    branches:
      - feat/rangate-skill
    paths:
      - '.github/workflows/rangate-render-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render README and registry
        run: python3 tools/render_readme.py
      - name: Commit generated files
        run: |
          if git diff --quiet -- README.md registry/skills.json; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md registry/skills.json
          git commit -m "docs: register RanGate in marketplace [skip ci]"
          git push
