name: CacheClosure experiment

on:
  push:
    branches:
      - research/cacheclosure-v0
    paths:
      - "experiments/cacheclosure/**"
      - ".github/workflows/cacheclosure-experiment.yml"
  pull_request:
    paths:
      - "experiments/cacheclosure/**"
      - ".github/workflows/cacheclosure-experiment.yml"
  workflow_dispatch:

jobs:
  frozen-protocol:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run frozen protocol
        working-directory: experiments/cacheclosure
        run: PYTHONPATH=. python3 tests/run_tests.py --min 95
