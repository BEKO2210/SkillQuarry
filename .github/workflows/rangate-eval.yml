name: RanGate Evaluation

on:
  push:
    branches:
      - test/rangate-pro-20260814
    paths:
      - 'experiments/rangate/**'
      - '.github/workflows/rangate-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/rangate
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Format check
        run: cargo fmt --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets -- --nocapture
