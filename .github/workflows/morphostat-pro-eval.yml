name: Morphostat pro evaluation

on:
  push:
    branches:
      - test/morphostat-pro-20260814
    paths:
      - 'experiments/morphostat/pro_test.py'
      - 'experiments/morphostat/pro_test_v2.py'
      - 'experiments/morphostat/redteam.py'
      - 'experiments/morphostat/compiler_native_feasibility.py'
      - 'experiments/morphostat/lsp_semantic_feasibility.py'
      - 'experiments/morphostat/lsp_semantic_feasibility_v2.py'
      - '.github/workflows/morphostat-pro-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
          rustup component add rust-analyzer rust-src --toolchain 1.97.1
          rustup toolchain install nightly-2026-08-13 --profile minimal
          rustc --version
          cargo --version
          rust-analyzer --version
          rustc +nightly-2026-08-13 --version
          python3 --version
      - name: Syntax check
        working-directory: experiments/morphostat
        run: python3 -m py_compile pro_test.py pro_test_v2.py redteam.py compiler_native_feasibility.py lsp_semantic_feasibility.py lsp_semantic_feasibility_v2.py
      - name: Run 22-case A/B pro test
        working-directory: experiments/morphostat
        run: python3 pro_test_v2.py
      - name: Evaluate Rust syntax edge cases
        working-directory: experiments/morphostat
        run: python3 redteam.py
      - name: Evaluate compiler-native morphology sources
        working-directory: experiments/morphostat
        run: python3 compiler_native_feasibility.py
      - name: Evaluate rust-analyzer semantic edges after readiness
        working-directory: experiments/morphostat
        run: python3 lsp_semantic_feasibility_v2.py
