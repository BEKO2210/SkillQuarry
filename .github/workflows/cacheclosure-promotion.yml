# Temporary branch-only sync; remove before opening the promotion PR.
name: CacheClosure promotion sync

on:
  push:
    branches:
      - research/cacheclosure-v0
    paths:
      - "skills/coding/cacheclosure/**"
      - ".github/workflows/cacheclosure-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest and frozen suite
        run: |
          python3 tools/validate_skills.py
          cd skills/coding/cacheclosure
          PYTHONPATH=src python3 tests/run_tests.py --min 95
      - name: Regenerate repository indexes
        run: |
          python3 tools/render_readme.py
          python3 tools/build_history.py
          python3 tools/build_site.py
          python3 tools/registry.py verify
      - name: Commit generated files if needed
        run: |
          if git diff --quiet -- README.md registry site; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md registry site
          git commit -m "docs: register CacheClosure in generated indexes [skip ci]"
          git push
