name: checks

on:
  push:
    branches: [main]
    paths:
      - "skills/**/skill.json"
      - "tools/**"
      - "templates/**"
      - "cli/**"
      - "site/**"
      - "README.md"
      - "registry/**"
      - "docs/**"
      - ".github/workflows/readme.yml"
  pull_request:
    paths:
      - "skills/**/skill.json"
      - "tools/**"
      - "templates/**"
      - "cli/**"
      - "site/**"
      - "README.md"
      - "registry/**"
      - "docs/**"
      - ".github/workflows/readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build_history reads the commit history; a shallow clone would truncate it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the repository tooling
        run: |
          python3 tools/test_render_readme.py
          python3 tools/test_validate_skills.py
          python3 tools/test_new_skill.py
          python3 tools/test_registry.py
          python3 tools/test_build_site.py
          python3 tools/test_package_skills.py
          python3 tools/test_build_history.py

      # The template is the example every contribution is copied from, so its own
      # suite runs here; a rotten example would be inherited by every new skill.
      - name: Run the example skill's suite
        working-directory: templates/example-skill
        run: python3 tests/run_tests.py --min 100

      - name: Run the skillquarry client suite
        working-directory: cli
        run: python3 tests/run_tests.py --min 100

      - name: Validate skill manifests against registry/schema.json
        run: python3 tools/validate_skills.py

      - name: Verify registry checksums match the files on disk
        run: python3 tools/registry.py verify

      # On a pull request the generated files must already be current, because the
      # workflow cannot push to a fork.
      - name: Verify generated files are current
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/render_readme.py --check
          python3 tools/build_history.py --check
          python3 tools/build_site.py --check

      - name: Regenerate README, registry and site
        if: github.event_name != 'pull_request'
        run: |
          python3 tools/render_readme.py
          python3 tools/build_history.py
          python3 tools/build_site.py

      - name: Commit if the manifests moved ahead of the README
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md registry site; then
            echo "README, registry and site already match the manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md registry site
          git commit -m "docs: regenerate README, registry and site from skill manifests [skip ci]"
          git push
